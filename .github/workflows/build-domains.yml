name: Build domain list

on:
  schedule:
    - cron: "5 */12 * * *"   # every 12 hours (UTC)
  workflow_dispatch:         # allow manual run from Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare environment
        run: chmod +x parse_adblock_to_domains.py

      - name: Fetch & build (force rebuild)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p dist
          out="dist/domains.txt"
          # ensure clean start — empty file before building
          : > "$out"

          tmpdir="$(mktemp -d)"
          n_ok=0

          echo "Fetching sources..."
          while IFS= read -r url; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            echo "  - $url"
            if curl -fsSL "$url" -o "$tmpdir/src-$RANDOM.txt"; then
              n_ok=$((n_ok+1))
            else
              echo "WARN: failed to fetch $url" >&2
            fi
          done < adblock_sources.txt

          if [[ $n_ok -eq 0 ]]; then
            echo "ERROR: No sources fetched; refusing to overwrite output." >&2
            exit 1
          fi

          echo "Parsing filter lists..."
          cat "$tmpdir"/src-*.txt | ./parse_adblock_to_domains.py --sort > "$out".new

          echo "Running basic sanity filter..."
          awk 'tolower($0) ~ /^[a-z0-9.-]+$/ && index($0,"..")==0 && length($0)<=253' "$out".new > "$out".clean
          mv "$out".clean "$out".new

          mv "$out".new "$out"
          echo "Build completed: $(wc -l < "$out") domains"

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain dist/domains.txt)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/domains.txt
            git commit -m "Rebuild domains list $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No changes to commit."
          fi
