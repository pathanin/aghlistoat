name: Build domain list

on:
  schedule:
    - cron: "5 */12 * * *"   # every ~12h (UTC). Change as you like.
  workflow_dispatch:         # allow manual run from the Actions tab

permissions:
  contents: write            # needed to push commits

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -V
          chmod +x parse_adblock_to_domains.py

      - name: Fetch & build (replace, never append)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Start clean so no old domains linger
          rm -rf dist
          mkdir -p dist
          tmpdir="$(mktemp -d)"

          # Fetch all sources fresh
          n_ok=0
          while IFS= read -r url; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            echo "Fetching: $url"
            if curl -fsSL "$url" -o "$tmpdir/src-$RANDOM.txt"; then
              n_ok=$((n_ok+1))
            else
              echo "WARN: failed to fetch $url" >&2
            fi
          done < adblock_sources.txt

          if [[ $n_ok -eq 0 ]]; then
            echo "ERROR: No sources fetched; refusing to overwrite output." >&2
            exit 1
          fi

          # Build a brand-new domains.txt
          out="dist/domains.txt"
          cat "$tmpdir"/src-*.txt | ./parse_adblock_to_domains.py --sort > "$out".new

          # Lightweight sanity filter
          awk 'tolower($0) ~ /^[a-z0-9.-]+$/ && index($0,"..")==0 && length($0)<=253' "$out".new > "$out".clean
          mv "$out".clean "$out".new

          # Move into place atomically
          mv "$out".new "$out"

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain dist/domains.txt)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/domains.txt
            git commit -m "Rebuild domains list $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No change; nothing to commit."
          fi

